[package]
name = "rcu-shim"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py38"] }
pythonize = "0.26.0"
rcu = { git = "https://github.com/NKID00/redstone-computer-utilities-rust.git", rev = "edc1677f6be31638624fcaa0afe970b24c8ce4fe", package = "redstone-computer-utilities" }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
